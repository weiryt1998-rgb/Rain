name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one but never an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep Playwright traces from failed runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Publish site
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site
        # Only the files the browser needs; tooling, tests and image source notes stay out of the published site.
        run: |
          mkdir -p site/images site/icons
          cp index.html style.css script.js weather-core.js weather-backdrop.js theme-init.js sw.js favicon.svg manifest.webmanifest site/
          cp icons/*.png site/icons/
          rsync -a --include='*/' --include='*.jpg' --exclude='*' images/ site/images/
          find site -type f | sort
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
